services:
  - type: web
    name: climatwin-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: FIREBASE_PROJECT_ID
        value: invest-2-77a18
      - key: GOOGLE_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: false
